# Tooling config for the hexa-ai-benchmark auditor/KB (local dev; no CI).
# Scoring semantics are NOT affected by anything here.

[tool.pytest.ini_options]
# Un seul paquet, `hexa` : chaque benchmark et le noyau portent leurs tests.
testpaths = ["hexa"]
pythonpath = ["."]
# Plusieurs dossiers `tests/` : import par chemin complet, pas de collision de basenames.
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["runs", "sites", "node_modules", "venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# The formatter owns line length; long URLs/strings should not fail lint.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Scripts exécutés DANS Blender : ajoutent leur dossier au sys.path avant d'importer _common.
"hexa/benches/blender/bpy/*.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["hexa"]

[tool.ruff.format]
quote-style = "double"
